name: AURA intraday portfolio alerts
on:
  workflow_dispatch:
  schedule:
    # 11:05 and 14:35 IST. GitHub timing is best effort.
    - cron: '35 5 * * 1-5'
    - cron: '05 9 * * 1-5'
permissions:
  contents: read
concurrency:
  group: aura-automation
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m automation.notify intraday
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AURA_USER_ID: ${{ secrets.AURA_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
