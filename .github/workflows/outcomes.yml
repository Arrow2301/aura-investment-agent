name: AURA forward outcomes
on:
  workflow_dispatch:
  schedule:
    # Weekdays, 18:00 IST, after the end-of-day scan.
    - cron: '30 12 * * 1-5'
permissions:
  contents: read
concurrency:
  group: aura-forward-outcomes
  cancel-in-progress: false
jobs:
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m automation.outcomes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
