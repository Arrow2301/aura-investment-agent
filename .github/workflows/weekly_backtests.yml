name: AURA weekly held-out backtests
on:
  workflow_dispatch:
  schedule:
    # Sunday 15:05 IST; no live trades or parameter changes.
    - cron: '35 9 * * 0'
permissions:
  contents: read
concurrency:
  group: aura-automation
  cancel-in-progress: false
jobs:
  backtests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m automation.backtest_run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
