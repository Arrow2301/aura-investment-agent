name: AURA India Production Daily

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC: 01:00 UTC = 06:30 IST (UTC+05:30).
    - cron: "00 1 * * 1-5"

jobs:
  aura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python automation/daily_run.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
