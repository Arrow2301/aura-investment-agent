from config.universe import NIFTY_SYMBOLS

from data.market_data import get_prices

from analysis.scoring import calculate_score

from database.supabase_client import save_signal



def run():

    results=[]


    for symbol in NIFTY_SYMBOLS:


        data = get_prices(symbol)


        if data is not None:


            score = calculate_score(data)


            decision = "WATCH"


            if score >= 75:
                decision = "BUY"


            elif score < 25:
                decision = "AVOID"



            record = {

                "symbol": symbol,
            
                "date": str(
                    data.iloc[-1]["Date"]
                ),
            
                "technical_score": score,
            
                "fundamental_score": 0,
            
                "sentiment_score": 0,
            
                "overall_score": score,
            
                "decision": decision,
            
                "reason":
                "Technical analysis score"
            
            }


            save_signal(record)


            results.append(record)



    print(results)



if __name__ == "__main__":

    run()
