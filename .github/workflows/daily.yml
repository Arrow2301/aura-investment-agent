name: AURA V3 Daily Run

on:
  workflow_dispatch:
  schedule:
    - cron: "00 1 * * *"

jobs:
  aura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python automation/daily_run.py
